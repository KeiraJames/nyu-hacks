<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid Learning UI</title>
    <link rel="stylesheet" href="child.css">
</head>

<body>
    <div class="frame">

        <!-- Left Column -->
        <aside class="left">
            <button class="icon-btn">
                <span>🔊</span>
            </button>

            <div class="word-box">DOG</div>

            <div class="choice">
                <img src="dog.jpg" alt="Dog">
            </div>

            <div class="choice">
                <img src="cat.jpg" alt="Cat">
            </div>
        </aside>

        <!-- Main Large Panel -->
        <main class="main-view"></main>

        <!-- Right Column Buttons -->
        <aside class="right">
            <!-- <button class="round-btn">speaker</button> -->
            <button class="round-btn">end call</button>
        </aside>

        <!-- Bottom Right Small Panel -->
        <div class="child-cam"></div>

    </div>
</body>
</html>
