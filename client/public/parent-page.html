<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On The Go Storyteller</title>
    <link rel="stylesheet" href="css/parent.css" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <main class="phones-container">
        <!-- Phone 1: In-Call Screen -->
        <div class="phone-wrapper" id="in-call-screen">
            <div class="phone-frame">
                <div class="phone-screen">
                    <div class="screen-content">
                        <!-- STORY / TRANSCRIPTION AREA -->
                        <div class="transcription-box">
                            <!-- tst.js uses #status as the story text display -->
                            <p id="status" class="transcription-text">
                                Ready to start/join a call.
                            </p>
                            <span class="cursor"></span>
                        </div>

                        <!-- NEW: Next line button for narrator (Parent only) -->
                        <div class="transcription-controls">
                            <button id="nextLineButton" class="next-line-button" type="button">
                                Next line
                            </button>
                        </div>

                        <!-- VIDEO AREA: remote + local PiP -->
                        <div class="video-call-container">
                            <video id="remoteVideo" autoplay playsinline></video>

                            <div class="self-view-feed">
                                <video id="localVideo" autoplay muted playsinline></video>
                            </div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="controls">
                        <button class="control-button" type="button">speaker</button>
                        <button
                            id="endCallButton"
                            class="control-button end-call"
                            type="button"
                            style="display:none;"
                        >
                            end call
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phone 2: Overview Screen -->
        <div class="phone-wrapper" id="overview-screen">
            <div class="phone-frame">
                <div class="phone-screen">
                    <div class="screen-content">
                        <h2 class="overview-header">Overview</h2>
                        <div class="recommendations">
                            <h3 class="recommendations-title">Recommended Stories</h3>
                            <p class="recommendations-subtitle">
                                *based on child comprehension level
                            </p>
                            <div class="story-grid">
                                <div class="story-card"></div>
                                <div class="story-card"></div>
                            </div>
                        </div>
                    </div>
                    <div class="controls">
                        <button class="control-button" type="button">speaker</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hidden RTC controls for tst.js -->
    <input
        type="hidden"
        id="userRoleInput"
        value="Parent"
        class="hidden-rtc"
    />
    <input
        type="hidden"
        id="roomInput"
        value="test-room"
        class="hidden-rtc"
    />
    <button id="joinButton" class="hidden-rtc" type="button">
        Start Story Call
    </button>

    <script src="js/tst.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const endBtn = document.getElementById("endCallButton");
        const inCallScreen = document.getElementById("in-call-screen");
        const overviewScreen = document.getElementById("overview-screen");

        if (!endBtn || !inCallScreen || !overviewScreen) return;

        endBtn.addEventListener("click", () => {
            // Only mobile (<901px)
            if (window.innerWidth <= 900) {
                // Switch screens
                inCallScreen.style.display = "none";
                overviewScreen.style.display = "flex";   // override default "display:none"
                overviewScreen.classList.add("show");    // if your CSS has show logic
            }
        });
    });
    </script>
</body>
</html>
