<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        /* Shared Styles */
        .video-container {
            position: relative; width: 100%; padding-top: 75%; 
            background-color: #1e293b; border-radius: 0.75rem;
            overflow: hidden; box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        .video-container video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; 
        }
        #localVideo { transform: scaleX(-1); }
        #remoteVideo { transform: scaleX(1); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">

    <header class="text-center mb-8 w-full max-w-4xl">
        <h1 class="text-4xl font-extrabold text-indigo-400">P2P Story Call</h1>
        <p id="status" class="mt-2 text-lg text-gray-400">Enter a room name to start or join a call.</p>
        <p id="role-display" class="mt-1 text-xl font-bold text-green-400">Role: Child</p>
    </header>

    <main class="w-full max-w-4xl">
        
        <input type="hidden" id="userRoleInput" value="Child">

        <div id="controls" class="flex flex-col sm:flex-row gap-4 mb-8 p-4 bg-gray-800 rounded-xl shadow-lg">
            <input type="text" id="roomInput" placeholder="Enter Room Name (e.g., 'story-call')" 
                   class="flex-grow p-3 rounded-lg border border-indigo-600 bg-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition"
                   value="test-room">
            <button id="joinButton" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition">
                Start / Join Story
            </button>
            <button id="endCallButton" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-md transition" style="display: none;">
                End Call
            </button>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col items-center"><h2 class="text-xl font-semibold mb-3 text-indigo-300">My Video</h2>
                <div class="video-container"><video id="localVideo" autoplay muted playsinline></video></div>
            </div>
            <div class="flex flex-col items-center"><h2 class="text-xl font-semibold mb-3 text-indigo-300">Remote Video</h2>
                <div class="video-container"><video id="remoteVideo" autoplay playsinline></video></div>
            </div>
        </div>

        <div id="parent-view" style="display: none;"></div>
        
        <div id="child-view" class="w-full mt-8 p-6 bg-white rounded-xl shadow-2xl">
             <h2 class="text-xl font-bold text-gray-800 mb-4">Interactive Story (Child)</h2>

             <div id="child-interactive-area" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                 
                 <div class="col-span-1 flex flex-col items-start space-y-4">
                     <div class="flex items-center space-x-2">
                         <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2m-7 14v-6m0 0l-3 3m3-3l3 3"></path></svg>
                     </div>
                     <div id="child-word-display" class="text-5xl font-extrabold text-gray-900 border-2 border-gray-300 p-4 rounded-lg">
                         Waiting...
                     </div>
                     <div id="child-options-container" class="space-y-2">
                         <p class="text-gray-600">The current puzzle/interaction will appear here.</p>
                     </div>
                 </div>

                 <div id="child-main-narrative" class="col-span-2 bg-gray-100 p-6 rounded-lg text-lg text-gray-700">
                     Waiting for the Parent to start the story.
                 </div>
                 
             </div>
        </div>
    </main>

    <script src="/js/tst.js"></script>
</body>
</html>
