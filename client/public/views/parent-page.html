<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On The Go Storyteller</title>
    <link rel="stylesheet" href="../css/parent-style.css">
<script type="importmap">

</script>
</head>
<body>
    <div class="main-title">
        <h1>on the go</h1>
    </div>
    <div class="phone-mockup">
        <div class="screen">
            <div class="notch"></div>

            <main id="main-content">
                <!-- Story View (Initial State) -->
                <div id="story-view">
                    <div class="chat-bubble">
                        <p>The first little pig was very lazy.</p>
                    </div>
                </div>

                <!-- Overview View (Initially Hidden) -->
                <div id="overview-view" style="display: none;">
                    <h1>Overview</h1>
                    <div class="recommendations">
                        <h2>Recommended Stories</h2>
                        <p>*based on child comprehension level</p>
                        <div class="recommendations-grid">
                            <div class="recommendation-item"></div>
                            <div class="recommendation-item"></div>
                        </div>
                    </div>
                </div>
            </main>
            
            <div class="bottom-controls">
                <div class="controls-inner">
                    <button id="speaker-button" class="control-button speaker-button">
                        <span class="button-text">speaker</span>
                    </button>
                    <button id="end-call-button" class="control-button end-call-button">
                        <span class="button-text">end call</span>
                    </button>
                    <button id="next-button" class="control-button next-button">
                        <span class="button-text">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/js/tst.js"></script>
  <script type="module" src="s.js"></script>

</body>
</html>
