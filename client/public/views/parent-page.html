<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Story Call</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>

<body>

<div id="app">
  <div class="phone">
    
    <!-- HEADER -->
    <header class="header">
      <button class="back-button">←</button>
      <div class="username">
        <p class="name">AI Storyteller</p>
      </div>
      <div class="menu-icon">⋮</div>
    </header>

    <!-- CALL SCREEN (Option A - in-call phone UI) -->
    <div class="call-screen active">

      <!-- FULLSCREEN remote video -->
      <div class="video-call-container">
        <video id="remoteVideo" autoplay playsinline></video>
      </div>

      <!-- PIP self video -->
      <div class="self-view-feed">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

      <!-- CALL ACTIONS -->
      <div class="call-actions">
        <button class="call-action-button">📞</button>
        <button class="call-action-button active">📷</button>
        <button class="call-action-button">🎤</button>
        <button class="call-action-button">💬</button>
      </div>

      <div class="end-call-button-container">
        <button id="endCallButton" class="end-call-button" style="display:none">End Call</button>
      </div>
    </div>

    <!-- STORY / MESSAGE SCREEN -->
    <div class="conversation active">
      <div class="message-list">
        <!-- Status -->
        <div id="status" class="status-text">Ready to join.</div>
      </div>

      <!-- Hidden inputs for roles -->
      <input type="hidden" id="userRoleInput" value="Parent">
      <input type="text" id="roomInput" placeholder="Room name" value="test-room" class="hidden">

      <!-- THIS button starts WebRTC -->
      <button id="joinButton" class="floating-join-button">Start Story Call</button>
    </div>

  </div>
</div>

<!-- Use relative path so browser can find the file -->
<script src="tst.js"></script>
</body>
</html>
