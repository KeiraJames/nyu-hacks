<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>On The Go Storyteller · Child</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
     <link href="css/child.css" rel="stylesheet" />
</head>
<body>
  <div class="frame">
    <div id="status" class="story-box">
      Waiting for the story to start…
    </div>

    <div class="bottom-layout">
      <div class="avatar-column">
        <div class="avatar-wrapper">
          <img id="char1Avatar" class="avatar-image" src="" />
        </div>
        <div id="char1Name" class="avatar-name">Char 1</div>
      </div>

      <div class="video-call-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="self-view-feed">
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
      </div>

      <div class="avatar-column">
        <div class="avatar-wrapper">
          <img id="char2Avatar" class="avatar-image" src="" />
        </div>
        <div id="char2Name" class="avatar-name">Char 2</div>
      </div>
    </div>

    <div class="controls-row">
      <button id="joinButton" class="call-btn" type="button">Start</button>
      <button id="endCallButton" class="call-btn" type="button">End</button>
    </div>
  </div>

  <input type="hidden" id="userRoleInput" value="Child" />
  <input type="hidden" id="roomInput" value="test-room" />

  <script src="js/tst.js"></script>
</body>
</html>
