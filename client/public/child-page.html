<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>On The Go Storyteller · Child</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #111827;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 24px;
        }

        .frame {
            background: #f8fafc;
            width: 100%;
            max-width: 1300px;
            padding: 32px 40px;
            border-radius: 32px;
            box-shadow:
                0 24px 50px rgba(15,23,42,0.34),
                inset 0 3px 8px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .story-box {
            background: #ffffff;
            border-radius: 18px;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            min-height: 56px;
            box-shadow:
                0 4px 9px rgba(15,23,42,0.10),
                inset 0 2px 6px rgba(255,255,255,0.8);
        }

        .bottom-layout {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
            margin-top: 8px;
        }

        .avatar-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 120px;
        }
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            border-radius: 999px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                0 8px 20px rgba(15,23,42,0.16),
                inset 0 3px 7px rgba(255,255,255,0.9);
        }
        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .avatar-name {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            text-align: center;
        }

        .speaking {
            animation: speakWiggle 0.28s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px rgba(252, 211, 77, 0.95));
        }
        @keyframes speakWiggle {
            from { transform: translateX(-4px) scale(1.04); }
            to   { transform: translateX(4px) scale(1.08); }
        }

        .video-call-container {
            position: relative;
            background: #d1d5db;
            border-radius: 24px;
            min-height: 380px;
            overflow: hidden;
            box-shadow:
                0 14px 26px rgba(15,23,42,0.35),
                inset 0 3px 9px rgba(255,255,255,0.75);
        }

        .video-call-container video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .self-view-feed {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 130px;
            height: 170px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.85);
            background: #9ca3af;
            box-shadow:
                0 10px 20px rgba(15,23,42,0.30),
                inset 0 2px 6px rgba(255,255,255,0.8);
        }
        .self-view-feed video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            margin-top: 8px;
            gap: 18px;
        }

        .call-btn {
            width: 110px;
            height: 110px;
            border-radius: 999px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow:
                0 10px 20px rgba(0,0,0,0.25),
                inset 0 3px 7px rgba(255,255,255,0.8);
        }

        #joinButton {
            background: #10b981;
            color: #ffffff;
        }

        #endCallButton {
            background: #ef4444;
            color: #ffffff;
            display: none;
        }

        @media (max-width: 900px) {
            .frame { padding: 18px; border-radius: 24px; }
            .bottom-layout { grid-template-columns: 1fr; }
            .avatar-column { flex-direction: row; justify-content: center; }
        }
    </style>
</head>
<body>
  <div class="frame">
    <div id="status" class="story-box">
      Waiting for the story to start…
    </div>

    <div class="bottom-layout">
      <div class="avatar-column">
        <div class="avatar-wrapper">
          <img id="char1Avatar" class="avatar-image" src="" />
        </div>
        <div id="char1Name" class="avatar-name">Char 1</div>
      </div>

      <div class="video-call-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="self-view-feed">
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
      </div>

      <div class="avatar-column">
        <div class="avatar-wrapper">
          <img id="char2Avatar" class="avatar-image" src="" />
        </div>
        <div id="char2Name" class="avatar-name">Char 2</div>
      </div>
    </div>

    <div class="controls-row">
      <button id="joinButton" class="call-btn" type="button">Start</button>
      <button id="endCallButton" class="call-btn" type="button">End</button>
    </div>
  </div>

  <input type="hidden" id="userRoleInput" value="Child" />
  <input type="hidden" id="roomInput" value="test-room" />

  <script src="js/tst.js"></script>
</body>
</html>
