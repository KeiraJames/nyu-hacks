<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>On The Go Storyteller · Choose a Story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #e0f2fe 0, #ffffff 55%, #f3e8ff 100%);
      color: #111827;
      padding: 2rem;
    }
    .shell {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      padding: 2rem 2.5rem;
      box-shadow:
        0 20px 50px rgba(15,23,42,0.18),
        inset 0 2px 4px rgba(255,255,255,0.7);
    }
    h1 {
      font-size: 1.9rem;
      margin: 0 0 0.25rem;
    }
    .subtitle {
      margin: 0 0 1.75rem;
      color: #6b7280;
      font-size: 0.95rem;
    }
    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }
    .story-card {
      background: #f9fafb;
      border-radius: 20px;
      padding: 1.2rem 1.1rem;
      box-shadow:
        0 6px 15px rgba(15,23,42,0.08),
        inset 0 2px 5px rgba(255,255,255,0.7);
      cursor: pointer;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
    }
    .story-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 18px rgba(15,23,42,0.12),
        inset 0 2px 4px rgba(255,255,255,0.8);
      border-color: #c4b5fd;
    }
    .story-title {
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .story-meta {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: #eef2ff;
      color: #4338ca;
      margin-top: 0.4rem;
    }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>What story are we reading today?</h1>
    <p class="subtitle">Pick a story. Next, you’ll choose whether you’re the parent or the child.</p>

    <div id="storyGrid" class="story-grid">
      <!-- Cards injected by JS -->
    </div>

    <p class="footer-note">
      Tip: you can come back here anytime to pick a different story.
    </p>
  </div>

  <script>
    async function loadStories() {
      const grid = document.getElementById('storyGrid');
      grid.innerHTML = '<p>Loading stories…</p>';

      try {
        const res = await fetch('/stories');
        const stories = await res.json();
        grid.innerHTML = '';

        stories.forEach((story, index) => {
          const card = document.createElement('div');
          card.className = 'story-card';
          card.innerHTML = `
            <div class="story-title">${story.title}</div>
            <div class="story-meta">
              ~${story.reading_time_approx_min} min ·
              ${story.characters?.char1_name || 'Char 1'} &amp;
              ${story.characters?.char2_name || 'Char 2'}
            </div>
            <span class="pill">Story ${index + 1}</span>
          `;
          card.addEventListener('click', () => {
            localStorage.setItem('selectedStory', String(index));
            window.location.href = 'role-select.html';
          });
          grid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p>Failed to load stories. Please try again.</p>';
      }
    }

    loadStories();
  </script>
</body>
</html>
